# The Dashboard service must remain bound to 127.0.0.1.
ProxyPass        /2faskw-dashboard http://127.0.0.1:9080/2faskw-dashboard
ProxyPassReverse /2faskw-dashboard http://127.0.0.1:9080/2faskw-dashboard

<Location /2faskw-dashboard>
    AuthType shibboleth
    ShibRequestSetting requireSession 1
    Require shib-session

    RequestHeader unset X-Remote-User
    RequestHeader unset X-2FASKW-Role
    RequestHeader unset X-2FASKW-Proxy-Secret
    RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"
    RequestHeader set X-2FASKW-Role "DASHBOARD_VIEWER"
    RequestHeader set X-2FASKW-Proxy-Secret "REPLACE_WITH_PROXY_SECRET"
</Location>
