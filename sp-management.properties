# 2FAS-KW SP management CLI settings.
# Keep disabled until an IdP administrator has reviewed the local metadata,
# attribute release, and MFA policy ownership boundaries.
graphicalmatrix.sp.management.enabled = false

# HTTPS metadata endpoints must use one of these comma-separated FQDNs.
# IP literals, redirects, URL credentials, query strings, and fragments are rejected.
graphicalmatrix.sp.metadata.allowedHosts =

# AssertionConsumerService HTTPS hosts accepted for metadata files. Metadata
# downloaded from an allowed host automatically permits the same host.
graphicalmatrix.sp.metadata.allowedAcsHosts =

graphicalmatrix.sp.metadata.maxBytes = 1048576
graphicalmatrix.sp.metadata.connectTimeoutSeconds = 5
graphicalmatrix.sp.metadata.readTimeoutSeconds = 10

# External IdP reload commands are enabled in production. Unit tests and an
# offline staging tree may set this to false explicitly.
graphicalmatrix.sp.reload.enabled = true

# Optional Shibboleth administrative-flow base URL used as IDP_BASE_URL by
# graphicalmatrix-sp.sh. Empty uses the Shibboleth default http://localhost/idp.
# A direct loopback URL is suitable when the IdP is not proxied on localhost:80.
graphicalmatrix.sp.reload.baseUrl =

graphicalmatrix.sp.revision.retentionDays = 180
graphicalmatrix.sp.revision.maxPerSp = 50
graphicalmatrix.sp.backup.retentionDays = 30

# Approved custom profiles use:
# graphicalmatrix.sp.attributeProfile.employee = uid,mail,eduPersonAffiliation
